name: Ошибка
description: Мод ведёт себя не так, тормозит или роняет игру
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Чем точнее шаги и чем больше приложено, тем быстрее найдём причину.
        **Как собрать сохранение, логи и отчёт о вылете одним архивом — [docs/diagnostics.md](https://github.com/jigarkhwar/civ6-settlements-advisor/blob/main/docs/diagnostics.md)**
        Windows: двойной щелчок по `tools/collect_diagnostics.cmd` до перезапуска игры; macOS: `tools/collect_diagnostics.sh`.

  - type: dropdown
    id: area
    attributes:
      label: Где проблема
      multiple: true
      options:
        - Линза и тройка мест для Поселенца
        - Подсказка при наведении
        - Раскладка районов
        - Метки на карте (районы, площадь, города треугольника, улучшения)
        - Тормоза
        - Вылет игры
        - Другое
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что ты видишь и почему это неправильно.
      placeholder: "Например: метки Кампуса второго города переставляются каждый ход без видимой причины."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
      placeholder: "Например: метка остаётся на месте, пока не появится заметно лучшая клетка."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Шаги от загрузки сохранения. Координаты клеток (x, y) очень помогают.
      placeholder: |
        1. Загрузить сохранение
        2. Выбрать Поселенца у (60, 20)
        3. Навести курсор на (63, 22)
        4. ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто
      options:
        - Всегда
        - Иногда
        - Один раз
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Партия
      description: Цивилизация и лидер, ход, скорость игры, тип и размер карты.
      placeholder: "Кри, Паундмейкер, ход 42, стандартная скорость, Континенты, маленькая"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Платформа и версии
      description: ОС, версия игры (видна в главном меню), откуда стоит Detailed Map Tacks, откуда и когда взят мод.
      placeholder: "Windows 11, Civ VI 1.0.12.x, DMT из Steam Workshop, мод из main от 29.10"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Другие включённые моды
      placeholder: "Только Detailed Map Tacks"

  - type: textarea
    id: log
    attributes:
      label: Лог
      description: |
        Строки `SA_ERROR`, `SA_SLOW`, `SA_PINS` из `lua-SA-lines.txt` (Windows) или `tuner-SA-lines.txt` (macOS)
        архива диагностики. Для вылета — время вылета. Весь архив прикладывай ниже.
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: Архив диагностики и скриншоты
      description: Перетащи сюда архив диагностики (`SA-diagnostics-*.zip` с рабочего стола на Windows или `logs/diagnostics-*.zip` на macOS — в нём сохранение, логи и отчёты о вылетах) и скриншот, где видно проблему.
    validations:
      required: true
